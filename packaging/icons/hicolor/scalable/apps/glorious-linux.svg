<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 256 256">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#2A2D33"/>
      <stop offset="1" stop-color="#121316"/>
    </linearGradient>
    <linearGradient id="amber" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#FFC857"/>
      <stop offset="1" stop-color="#F0880F"/>
    </linearGradient>
    <linearGradient id="cap" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#FFD079"/>
      <stop offset="1" stop-color="#F29A1C"/>
    </linearGradient>
    <linearGradient id="capSide" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#C96F0A"/>
      <stop offset="1" stop-color="#9A5206"/>
    </linearGradient>
  </defs>
  <!-- tile -->
  <rect width="256" height="256" rx="58" fill="url(#bg)"/>
  <rect x="3" y="3" width="250" height="250" rx="55" fill="none" stroke="#FFFFFF" stroke-opacity="0.06" stroke-width="2"/>
  <!-- keycap, bottom right -->
  <rect x="112" y="116" width="112" height="108" rx="24" fill="url(#capSide)"/>
  <rect x="120" y="116" width="96" height="88" rx="18" fill="url(#cap)"/>
  <!-- mouse, overlapping the keycap -->
  <rect x="38" y="34" width="104" height="168" rx="52" fill="#16171B" stroke="url(#amber)" stroke-width="12"/>
  <path d="M90 34 V96 M38 98 H142" stroke="url(#amber)" stroke-width="10" stroke-linecap="round"/>
  <rect x="80" y="54" width="20" height="34" rx="10" fill="#16171B" stroke="url(#amber)" stroke-width="8"/>
</svg>
