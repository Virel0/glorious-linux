[package]
name = "glorious-linux"
version = "0.5.1"
edition = "2021"
description = "Glorious mouse and keyboard software for Linux: Model O3/D3, GMMK 3 HE, firmware updates (GUI + CLI)"
license = "GPL-3.0-or-later"
repository = "https://github.com/Virel0/glorious-linux"

[[bin]]
name = "glorious"
path = "src/main.rs"

[dependencies]
anyhow = "1"
clap = { version = "4", features = ["derive"] }
hidapi = { version = "2", default-features = false, features = ["linux-native"] }
serde_json = "1"
ureq = { version = "3", features = ["json"] }
zip = { version = "9", default-features = false, features = ["deflate"] }
serialport = { version = "4", default-features = false }
serde = { version = "1", features = ["derive"] }
sha2 = "0.11"
tempfile = "3"
eframe = { version = "0.37", default-features = false, features = ["default_fonts", "glow", "wayland", "x11"] }
