[package]
name = "glorious-linux"
version = "0.5.0"
edition = "2021"
description = "Glorious mouse and keyboard software for Linux: Model O3/D3, GMMK 3 HE, firmware updates (GUI + CLI)"
license = "GPL-3.0-or-later"
repository = "https://github.com/Virel0/glorious-linux"

[[bin]]
name = "glorious"
path = "src/main.rs"

[dependencies]
anyhow = "1"
clap = { version = "4", features = ["derive"] }
hidapi = { version = "2", default-features = false, features = ["linux-native"] }
serde_json = "1"
ureq = { version = "2", features = ["json"] }
zip = { version = "9", default-features = false, features = ["deflate"] }
serialport = { version = "4", default-features = false }
serde = { version = "1", features = ["derive"] }
sha2 = "0.11"
tempfile = "3"
eframe = { version = "0.33", default-features = false, features = ["default_fonts", "glow", "wayland", "x11"] }
egui-phosphor = "0.11"
# Keyboard protocol, state and device worker (MIT), pinned to the commit checked against Glorious CORE.
inglorious-core = { git = "https://github.com/tg5ee/inglorious-core-linux", rev = "2bf5c6faecd7d7337e7f6e0e4e25dfb64524b9f3" }
