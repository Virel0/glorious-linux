version: 2
updates:
  - package-ecosystem: cargo
    directory: /
    schedule:
      interval: weekly
    # Let new releases settle for a week before proposing them (yanked or compromised versions
    # usually surface by then). Security updates are not delayed.
    cooldown:
      default-days: 7
    groups:
      cargo-minor:
        update-types: [minor, patch]
  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: weekly
    cooldown:
      default-days: 7
    groups:
      actions:
        patterns: ['*']
