name: ci
on:
  push:
    branches: [main]
  pull_request:
  schedule:
    - cron: '17 6 * * 1' # weekly, to catch new advisories against the locked dependencies
permissions:
  contents: read
jobs:
  check:
    runs-on: ubuntu-22.04
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - run: sudo apt-get update && sudo apt-get install -y libudev-dev pkg-config
      - run: rustup toolchain install stable --profile minimal --component clippy,rustfmt && rustup default stable
      - run: cargo fmt --check
      - run: cargo clippy --release --locked --all-targets -- -D warnings
      - run: cargo test --release --locked
      - run: bash -n install.sh uninstall.sh scripts/*.sh
      - name: Banned dependencies
        # aws-lc-rs is a large C/assembly crypto build; TLS stays on ring. Cargo.lock lists every
        # crate that could be compiled on any platform, so this also catches optional ones.
        run: |
          banned='aws-lc-rs|aws-lc-sys|aws-lc-fips-sys|openssl|openssl-sys|native-tls'
          if grep -nE "^name = \"($banned)\"$" Cargo.lock; then
            echo "::error file=Cargo.lock::banned dependency in Cargo.lock (see above); keep TLS on rustls + ring"
            exit 1
          fi
      - name: Size report
        run: scripts/size-report.sh
  audit:
    runs-on: ubuntu-22.04
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - run: rustup toolchain install stable --profile minimal && rustup default stable
      - run: cargo install cargo-audit --locked
      - run: cargo audit
