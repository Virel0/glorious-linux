# Builds a portable x86_64 binary (Ubuntu 22.04 glibc) and attaches it to the release for the tag
# with a SHA-256 checksum and a signed build-provenance attestation. install.sh downloads it when
# Rust isn't available and checks the checksum; `gh attestation verify` checks provenance.
#
# The build job only has a read-only token. A separate publish job, which builds nothing, attests,
# optionally signs, and uploads. Re-run for an existing tag from the Actions tab ("Run workflow")
# to fix a broken build without a new version; the tag itself can't be moved.
#
# Optional GPG signing: add a RELEASE_GPG_KEY repo secret (an ASCII-armoured private key, plus
# RELEASE_GPG_PASSPHRASE if it has one) and every release also gets a .asc signature.
name: release
on:
  push:
    tags: ['v*']
  workflow_dispatch:
    inputs:
      tag:
        description: Existing release tag to rebuild, e.g. v0.5.1
        required: true
permissions:
  contents: read
concurrency:
  group: release-${{ github.event.inputs.tag || github.ref_name }}
env:
  TAG: ${{ github.event.inputs.tag || github.ref_name }}
  ASSET: glorious-linux-x86_64-linux.tar.gz
jobs:
  build:
    runs-on: ubuntu-22.04
    steps:
      - name: Check tag
        run: |
          [[ "$TAG" =~ ^v[0-9]+\.[0-9]+\.[0-9]+([.-][0-9A-Za-z.-]+)?$ ]] || { echo "::error::not a release tag: $TAG"; exit 1; }
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: refs/tags/${{ env.TAG }}
          persist-credentials: false
      - name: Dependencies
        run: sudo apt-get update && sudo apt-get install -y libudev-dev pkg-config
      - name: Rust
        run: rustup toolchain install stable --profile minimal && rustup default stable
      - name: Test
        run: cargo test --release --locked
      - name: Build
        run: cargo build --release --locked
      - name: Package
        run: |
          d=dist/glorious-linux
          mkdir -p "$d/assets/fonts"
          cp target/release/glorious install.sh uninstall.sh README.md LICENSE "$d/"
          cp -r packaging "$d/"
          cp assets/fonts/OFL-*.txt "$d/assets/fonts/"
          tar -C dist -czf "$ASSET" glorious-linux
          sha256sum "$ASSET" > "$ASSET.sha256"
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: release
          path: |
            ${{ env.ASSET }}
            ${{ env.ASSET }}.sha256
          if-no-files-found: error
          retention-days: 7

  publish:
    needs: build
    runs-on: ubuntu-22.04
    permissions:
      contents: write      # create the release and upload its files
      id-token: write      # sign the attestation
      attestations: write  # store the attestation
    steps:
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: release
      - name: Verify checksum
        run: sha256sum -c "$ASSET.sha256"
      - name: Attest build provenance
        uses: actions/attest-build-provenance@4d101475d8b20a2381f78447822ac1eab6504dd8 # v4.2.2
        with:
          subject-path: ${{ env.ASSET }}
      - name: Sign (when RELEASE_GPG_KEY is set)
        env:
          GPG_KEY: ${{ secrets.RELEASE_GPG_KEY }}
          GPG_PASSPHRASE: ${{ secrets.RELEASE_GPG_PASSPHRASE }}
        run: |
          if [ -z "$GPG_KEY" ]; then
            echo "No RELEASE_GPG_KEY secret - skipping the GPG signature."
            exit 0
          fi
          export GNUPGHOME="$(mktemp -d)"
          printf '%s\n' "$GPG_KEY" | gpg --batch --import
          gpg --batch --yes --pinentry-mode loopback --passphrase "$GPG_PASSPHRASE" \
            --armor --detach-sign --output "$ASSET.asc" "$ASSET"
          rm -rf "$GNUPGHOME"
      - name: Publish
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
        run: |
          gh release view "$TAG" >/dev/null 2>&1 || gh release create "$TAG" --title "$TAG" --generate-notes --verify-tag
          files=("$ASSET" "$ASSET.sha256")
          [ -f "$ASSET.asc" ] && files+=("$ASSET.asc")
          gh release upload "$TAG" "${files[@]}" --clobber
