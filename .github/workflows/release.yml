# Builds a portable x86_64 binary (Ubuntu 22.04 glibc), attaches it to the release for the pushed
# tag with a SHA-256 checksum and a signed build-provenance attestation. install.sh downloads it
# when Rust isn't available and checks the checksum; `gh attestation verify` checks provenance.
name: release
on:
  push:
    tags: ['v*']
permissions:
  contents: read
jobs:
  build:
    runs-on: ubuntu-22.04
    permissions:
      contents: write      # create the release
      id-token: write      # sign the attestation
      attestations: write  # store the attestation
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Dependencies
        run: sudo apt-get update && sudo apt-get install -y libudev-dev pkg-config
      - name: Rust
        run: rustup toolchain install stable --profile minimal && rustup default stable
      - name: Test
        run: cargo test --release --locked
      - name: Build
        run: cargo build --release --locked
      - name: Package
        run: |
          d=dist/glorious-linux
          mkdir -p "$d/assets/fonts"
          cp target/release/glorious install.sh uninstall.sh README.md LICENSE "$d/"
          cp -r packaging "$d/"
          cp assets/fonts/OFL-*.txt "$d/assets/fonts/"
          tar -C dist -czf glorious-linux-x86_64-linux.tar.gz glorious-linux
          sha256sum glorious-linux-x86_64-linux.tar.gz > glorious-linux-x86_64-linux.tar.gz.sha256
      - name: Attest build provenance
        uses: actions/attest-build-provenance@4d101475d8b20a2381f78447822ac1eab6504dd8 # v4.2.2
        with:
          subject-path: glorious-linux-x86_64-linux.tar.gz
      - name: Publish
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release view "$GITHUB_REF_NAME" >/dev/null 2>&1 \
            || gh release create "$GITHUB_REF_NAME" --title "$GITHUB_REF_NAME" --generate-notes
          gh release upload "$GITHUB_REF_NAME" glorious-linux-x86_64-linux.tar.gz glorious-linux-x86_64-linux.tar.gz.sha256 --clobber
